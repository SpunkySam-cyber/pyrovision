experiment_id: yolo11s_baseline
model: yolo11s.pt
data: configs/dfire.yaml
metrics_file: metrics/yolo11s_baseline.json
project: runs/pyrovision

validation:
  imgsz: 640
  batch: 8
  device: 0
  workers: 2
  split: val
  plots: true
  conf: 0.001
  iou: 0.7

training:
  imgsz: 640
  epochs: 100
  batch: 8
  device: 0
  workers: 2
  patience: 20
  seed: 42
  deterministic: true
  pretrained: true
  amp: true
  cache: false
  plots: true
  save: true
  save_period: -1
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  degrees: 0.0
  translate: 0.1
  scale: 0.5
  shear: 0.0
  perspective: 0.0
  flipud: 0.0
  fliplr: 0.5
  mosaic: 1.0
  mixup: 0.0
  close_mosaic: 10

smoke_test:
  subset_size: 400
  subset_seed: 42
  manifest: data/processed/dfire/manifest.csv
  image_list: data/processed/dfire/smoke_test_train.txt
  data_config: data/processed/dfire/smoke_test.yaml
  training_overrides:
    epochs: 2
    batch: 4
    patience: 2
