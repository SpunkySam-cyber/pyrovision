[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyrovision-ai"
version = "0.1.0"
description = "Reusable local inference components for PyroVision AI"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.23,<3",
  "PyYAML==6.0.2",
]

[project.optional-dependencies]
inference = [
  "ultralytics==8.4.37",
  "opencv-python>=4.10,<6",
]

[tool.setuptools.packages.find]
where = ["src"]
